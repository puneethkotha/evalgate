services:
  db:
    image: pgvector/pgvector:pg16
    container_name: evalgate-db
    environment:
      POSTGRES_USER: evalgate
      POSTGRES_PASSWORD: evalgate
      POSTGRES_DB: evalgate
    ports:
      - "5432:5432"
    volumes:
      - evalgate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalgate -d evalgate"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  evalgate_pgdata:
