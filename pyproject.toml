[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalgate"
version = "0.1.0"
description = "Error-analysis-first eval + observability harness for LLM agents, with judge drift detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Puneeth Kotha" }]

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "psycopg2-binary",
    "pgvector",
    "numpy",
    "scikit-learn",
    "openai",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "pydantic>=2",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
evalgate = "evalgate.cli:main"
evalgate-serve = "evalgate.api:main"

[project.entry-points.pytest11]
evalgate = "evalgate.pytest_plugin"

[tool.setuptools.packages.find]
include = ["evalgate*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
